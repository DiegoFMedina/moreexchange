# PATH: nginx/cambios-web.conf
# DESC: Configuración Nginx como reverse proxy para frontend (Next.js) y API (NestJS) con headers de seguridad

# ── Upstream definitions ─────────────────────────────────────────────────────
upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream nestjs_upstream {
    server 127.0.0.1:3001;
    keepalive 64;
}

# ── Gzip ─────────────────────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript
           application/xml+rss application/atom+xml image/svg+xml;

# ── Frontend — moreexchange.cl ────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name moreexchange.cl www.moreexchange.cl;

    # Redirige todo el tráfico HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name moreexchange.cl www.moreexchange.cl;

    # SSL (Certbot coloca estos paths automáticamente)
    ssl_certificate     /etc/letsencrypt/live/moreexchange.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moreexchange.cl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Tamaño máximo de body (subidas)
    client_max_body_size 10m;

    # ── Headers de seguridad ──────────────────────────────────────────────────
    add_header X-Frame-Options            "DENY"                            always;
    add_header X-Content-Type-Options     "nosniff"                         always;
    add_header X-XSS-Protection           "1; mode=block"                   always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.stripe.com https://api.moreexchange.cl;" always;

    # ── Cache para assets estáticos de Next.js ────────────────────────────────
    location /_next/static/ {
        proxy_pass         http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;

        # Cache de 1 año para assets inmutables
        expires            1y;
        add_header         Cache-Control "public, immutable";
    }

    # ── Proxy hacia Next.js ───────────────────────────────────────────────────
    location / {
        proxy_pass         http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade         $http_upgrade;
        proxy_set_header   Connection      'upgrade';
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# ── API — api.moreexchange.cl ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.moreexchange.cl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.moreexchange.cl;

    ssl_certificate     /etc/letsencrypt/live/api.moreexchange.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.moreexchange.cl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10m;

    add_header X-Frame-Options        "DENY"   always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Webhook Stripe — CRITICAL: no modificar el body ──────────────────────
    # Stripe verifica la firma con el raw body. proxy_pass directo, sin buffering.
    location /v1/payments/webhook {
        proxy_pass              http://nestjs_upstream;
        proxy_http_version      1.1;
        proxy_set_header        Host            $host;
        proxy_set_header        X-Real-IP       $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;

        # Desactivar buffering para preservar el body exacto
        proxy_request_buffering off;
        proxy_buffering         off;
    }

    # ── Proxy general hacia NestJS ────────────────────────────────────────────
    location / {
        proxy_pass         http://nestjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade         $http_upgrade;
        proxy_set_header   Connection      'upgrade';
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
    }
}
