# More Exchange — Nginx reverse proxy
# Reemplaza __DOMAIN__ por tu dominio (ej: tudominio.com) antes de usar o usa scripts/setup-nginx.sh

server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Let's Encrypt ACME challenge (Certbot) — Nginx sirve esto; no enviar a Next.js
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        alias /var/www/certbot/.well-known/acme-challenge/;
        allow all;
    }

    # Next.js (web)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # NestJS API (prefijo /v1)
    location /v1 {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
